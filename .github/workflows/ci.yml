name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - run: ./build.sh
      - run: ./caforge --version
      - if: runner.os == 'Linux'
        run: go test -race ./internal/pki ./internal/store ./internal/authority ./internal/certificate ./internal/revocation
